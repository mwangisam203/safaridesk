services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend_venv:/app/.venv
      - article_uploads:/app/frontend/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    command: alembic upgrade head
    volumes:
      - .:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "3000:80"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - backend_venv:/app/.venv
      - article_uploads:/app/frontend/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    volumes:
      - .:/app
      - backend_venv:/app/.venv
      - article_uploads:/app/frontend/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend_venv:
  postgres_data:
  article_uploads:
